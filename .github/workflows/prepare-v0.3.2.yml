name: Prepare v0.3.2 release

on:
  push:
    branches: ["release/v0.3.2"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply version and release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version_paths = [
              "scholarly-novelty-audit/scripts/__init__.py",
              "docs/landscape.md",
              "docs/release-acceptance.md",
              "scholarly-novelty-audit/SKILL.md",
              "CITATION.cff",
              "pyproject.toml",
              "scholarly-novelty-audit/references/bridge-evidence.md",
              "scholarly-novelty-audit/scripts/providers/base.py",
              "scholarly-novelty-audit/scripts/fulltext.py",
              "scholarly-novelty-audit/scripts/providers/arxiv.py",
              "scholarly-novelty-audit/scripts/validate_output.py",
              "scholarly-novelty-audit/schemas/paper.schema.json",
              "scholarly-novelty-audit/schemas/claim.schema.json",
              "scholarly-novelty-audit/benchmark/bridge_base_rate.py",
              "scholarly-novelty-audit/schemas/evidence.schema.json",
              "scholarly-novelty-audit/benchmark/annotation.schema.json",
              "scholarly-novelty-audit/benchmark/prediction.schema.json",
              "docs/releasing.md",
              "scholarly-novelty-audit/schemas/report.schema.json",
              "scholarly-novelty-audit/references/tooling.md",
              "scholarly-novelty-audit/tests/unit/test_json_schemas.py",
              "scholarly-novelty-audit/tests/adversarial/test_validator.py",
              "scholarly-novelty-audit/tests/fixtures/composition-report.json",
          ]
          for raw_path in version_paths:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if "0.3.1" not in text:
                  raise SystemExit(f"expected 0.3.1 marker missing from {raw_path}")
              path.write_text(text.replace("0.3.1", "0.3.2"), encoding="utf-8")

          citation = Path("CITATION.cff")
          text = citation.read_text(encoding="utf-8")
          if "date-released: 2026-08-28" not in text:
              raise SystemExit("CITATION release date marker missing")
          citation.write_text(
              text.replace("date-released: 2026-08-28", "date-released: 2026-09-02", 1),
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## Unreleased" not in text:
              raise SystemExit("Unreleased changelog section missing")
          changelog.write_text(
              text.replace(
                  "## Unreleased",
                  "## 0.3.2 - 2026-09-02 — Historical arXiv version safety",
                  1,
              ),
              encoding="utf-8",
          )

          assembly = Path("scholarly-novelty-audit/scripts/report_assembly.py")
          text = assembly.read_text(encoding="utf-8")
          marker = 'RUNTIME_BINDING = "MACHINE_INJECTED_BEFORE_VALIDATION_AND_HASH"\n'
          if marker not in text:
              raise SystemExit("report assembly version marker missing")
          text = text.replace(marker, marker + 'TOOL_VERSION = "0.3.2"\n', 1)
          marker = '    manifest["runtime_environment"] = actual\n'
          if marker not in text:
              raise SystemExit("runtime binding marker missing")
          text = text.replace(marker, marker + '    manifest["tool_version"] = TOOL_VERSION\n', 1)
          assembly.write_text(text, encoding="utf-8")

          cli_test = Path("scholarly-novelty-audit/tests/integration/test_cli.py")
          text = cli_test.read_text(encoding="utf-8")
          marker = '    assert bound_report["run_manifest"]["runtime_environment"] == runtime_environment()\n'
          if marker not in text:
              raise SystemExit("report-attempt integration assertion marker missing")
          cli_test.write_text(
              text.replace(
                  marker,
                  marker + '    assert bound_report["run_manifest"]["tool_version"] == "0.3.2"\n',
                  1,
              ),
              encoding="utf-8",
          )
          PY
      - name: Run complete validation
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r scholarly-novelty-audit/requirements.txt
          python -m pytest scholarly-novelty-audit/tests -q
          python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate ./scholarly-novelty-audit
          python scholarly-novelty-audit/scripts/cli.py --help
          python scholarly-novelty-audit/scripts/secret_scan.py .
          python tools/build_runtime_bundle.py --skill scholarly-novelty-audit --output dist/scholarly-novelty-audit-v0.3.2.zip
          python -c "import zipfile; archive=zipfile.ZipFile('dist/scholarly-novelty-audit-v0.3.2.zip'); assert archive.read('scholarly-novelty-audit/LICENSE') == open('LICENSE','rb').read()"
          git diff --check
      - name: Commit validated release metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v0.3.2 metadata"
          git push origin HEAD:release/v0.3.2
