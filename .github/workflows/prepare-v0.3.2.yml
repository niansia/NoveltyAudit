name: Prepare v0.3.2 release

on:
  push:
    branches: ["release/v0.3.2"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply version and release metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version_paths = [
              "scholarly-novelty-audit/scripts/__init__.py",
              "docs/landscape.md",
              "docs/release-acceptance.md",
              "scholarly-novelty-audit/SKILL.md",
              "CITATION.cff",
              "pyproject.toml",
              "scholarly-novelty-audit/references/bridge-evidence.md",
              "scholarly-novelty-audit/scripts/providers/base.py",
              "scholarly-novelty-audit/scripts/fulltext.py",
              "scholarly-novelty-audit/scripts/providers/arxiv.py",
              "scholarly-novelty-audit/scripts/validate_output.py",
              "scholarly-novelty-audit/schemas/paper.schema.json",
              "scholarly-novelty-audit/schemas/claim.schema.json",
              "scholarly-novelty-audit/benchmark/bridge_base_rate.py",
              "scholarly-novelty-audit/schemas/evidence.schema.json",
              "scholarly-novelty-audit/benchmark/annotation.schema.json",
              "scholarly-novelty-audit/benchmark/prediction.schema.json",
              "docs/releasing.md",
              "scholarly-novelty-audit/schemas/report.schema.json",
              "scholarly-novelty-audit/references/tooling.md",
              "scholarly-novelty-audit/tests/unit/test_json_schemas.py",
              "scholarly-novelty-audit/tests/adversarial/test_validator.py",
              ".github/workflows/ci.yml",
              "scholarly-novelty-audit/tests/fixtures/composition-report.json",
          ]
          for raw_path in version_paths:
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if "0.3.1" not in text:
                  raise SystemExit(f"expected 0.3.1 marker missing from {raw_path}")
              path.write_text(text.replace("0.3.1", "0.3.2"), encoding="utf-8")

          citation = Path("CITATION.cff")
          text = citation.read_text(encoding="utf-8")
          if "date-released: 2026-08-28" not in text:
              raise SystemExit("CITATION release date marker missing")
          citation.write_text(
              text.replace("date-released: 2026-08-28", "date-released: 2026-09-02", 1),
              encoding="utf-8",
          )

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          if "## Unreleased" not in text:
              raise SystemExit("Unreleased changelog section missing")
          changelog.write_text(
              text.replace(
                  "## Unreleased",
                  "## 0.3.2 - 2026-09-02 — Historical arXiv version safety",
                  1,
              ),
              encoding="utf-8",
          )

          release = Path(".github/workflows/release.yml")
          text = release.read_text(encoding="utf-8")
          marker = '          --verify-tag\n          --generate-notes\n'
          if marker not in text:
              raise SystemExit("release CLI marker missing")
          release.write_text(
              text.replace(
                  marker,
                  '          --verify-tag\n          --prerelease\n          --generate-notes\n',
                  1,
              ),
              encoding="utf-8",
          )

          assembly = Path("scholarly-novelty-audit/scripts/report_assembly.py")
          text = assembly.read_text(encoding="utf-8")
          marker = 'RUNTIME_BINDING = "MACHINE_INJECTED_BEFORE_VALIDATION_AND_HASH"\n'
          if marker not in text:
              raise SystemExit("report assembly version marker missing")
          text = text.replace(
              marker,
              marker + 'TOOL_VERSION = "0.3.2"\n',
              1,
          )
          marker = '    manifest["runtime_environment"] = actual\n'
          if marker not in text:
              raise SystemExit("runtime binding marker missing")
          text = text.replace(
              marker,
              marker + '    manifest["tool_version"] = TOOL_VERSION\n',
              1,
          )
          assembly.write_text(text, encoding="utf-8")

          cli_test = Path("scholarly-novelty-audit/tests/integration/test_cli.py")
          text = cli_test.read_text(encoding="utf-8")
          marker = '    assert bound_report["run_manifest"]["runtime_environment"] == runtime_environment()\n'
          if marker not in text:
              raise SystemExit("report-attempt integration assertion marker missing")
          cli_test.write_text(
              text.replace(
                  marker,
                  marker + '    assert bound_report["run_manifest"]["tool_version"] == "0.3.2"\n',
                  1,
              ),
              encoding="utf-8",
          )
          PY

          cat > .github/workflows/publish-v0.3.2.yml <<'YAML'
          name: Publish NoveltyAudit v0.3.2

          on:
            push:
              branches: ["main"]

          permissions:
            contents: write

          jobs:
            clean-runtime-install:
              if: startsWith(github.event.head_commit.message, 'release: v0.3.2')
              strategy:
                matrix:
                  os: [ubuntu-latest, macos-latest]
              runs-on: ${{ matrix.os }}
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - run: python tools/build_runtime_bundle.py --skill scholarly-novelty-audit --output dist/scholarly-novelty-audit-v0.3.2.zip
                - run: python -m zipfile -e dist/scholarly-novelty-audit-v0.3.2.zip "$RUNNER_TEMP/noveltyaudit-runtime"
                - run: python -m venv "$RUNNER_TEMP/noveltyaudit-venv"
                - run: >-
                    "$RUNNER_TEMP/noveltyaudit-venv/bin/python"
                    -m pip install
                    -r "$RUNNER_TEMP/noveltyaudit-runtime/scholarly-novelty-audit/requirements.txt"
                - run: >-
                    "$RUNNER_TEMP/noveltyaudit-venv/bin/python"
                    "$RUNNER_TEMP/noveltyaudit-runtime/scholarly-novelty-audit/scripts/cli.py"
                    --help

            release:
              if: startsWith(github.event.head_commit.message, 'release: v0.3.2')
              needs: clean-runtime-install
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - run: python -m pip install --upgrade pip pytest
                - run: python -m pip install -r scholarly-novelty-audit/requirements.txt
                - run: python -m pytest scholarly-novelty-audit/tests -q
                - run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
                - run: skills-ref validate ./scholarly-novelty-audit
                - run: python tools/build_runtime_bundle.py --skill scholarly-novelty-audit --output dist/scholarly-novelty-audit-v0.3.2.zip
                - run: python -c "import zipfile; archive=zipfile.ZipFile('dist/scholarly-novelty-audit-v0.3.2.zip'); assert archive.read('scholarly-novelty-audit/LICENSE') == open('LICENSE','rb').read()"
                - run: sha256sum --check scholarly-novelty-audit-v0.3.2.zip.sha256
                  working-directory: dist
                - name: Create annotated tag
                  shell: bash
                  run: |
                    if git rev-parse -q --verify refs/tags/v0.3.2 >/dev/null; then
                      echo "v0.3.2 already exists" >&2
                      exit 1
                    fi
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git tag -a v0.3.2 -m "NoveltyAudit v0.3.2 — Alpha"
                    git push origin refs/tags/v0.3.2
                - name: Publish prerelease
                  run: >-
                    gh release create "v0.3.2"
                    "dist/scholarly-novelty-audit-v0.3.2.zip"
                    "dist/scholarly-novelty-audit-v0.3.2.zip.sha256"
                    --verify-tag
                    --prerelease
                    --generate-notes
                    --title "NoveltyAudit v0.3.2 — Alpha"
                  env:
                    GH_TOKEN: ${{ github.token }}
          YAML
      - name: Run complete validation
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r scholarly-novelty-audit/requirements.txt
          python -m pytest scholarly-novelty-audit/tests -q
          python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
          skills-ref validate ./scholarly-novelty-audit
          python scholarly-novelty-audit/scripts/cli.py --help
          python scholarly-novelty-audit/scripts/secret_scan.py .
          python tools/build_runtime_bundle.py --skill scholarly-novelty-audit --output dist/scholarly-novelty-audit-v0.3.2.zip
          python -c "import zipfile; archive=zipfile.ZipFile('dist/scholarly-novelty-audit-v0.3.2.zip'); assert archive.read('scholarly-novelty-audit/LICENSE') == open('LICENSE','rb').read()"
          git diff --check
      - name: Commit validated release preparation
        shell: bash
        run: |
          git rm .github/workflows/prepare-v0.3.2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release: prepare v0.3.2"
          git push origin HEAD:release/v0.3.2
