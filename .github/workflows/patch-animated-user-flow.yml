name: Patch animated README flow

on:
  push:
    branches: ["docs/animated-user-flow"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Insert the user-facing animated flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          svg = Path("docs/assets/noveltyaudit-user-flow.svg")
          ET.parse(svg)
          svg_text = svg.read_text(encoding="utf-8")
          if "<script" in svg_text.casefold() or "foreignObject" in svg_text:
              raise SystemExit("animated SVG contains a disallowed active-content element")
          if 'repeatCount="indefinite"' not in svg_text:
              raise SystemExit("animated SVG is not configured to loop")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = """The result is not a novelty score. It is an auditable claim map, historically eligible evidence, the smallest qualifying set of prior papers, bridge evidence between them, remaining novelty, and an explicit account of what the search could not establish.

## Quick start"""
          new = """The result is not a novelty score. It is an auditable claim map, historically eligible evidence, the smallest qualifying set of prior papers, bridge evidence between them, remaining novelty, and an explicit account of what the search could not establish.

## What happens in an audit

<p align=\"center\">
  <img src=\"docs/assets/noveltyaudit-user-flow.svg\" alt=\"Animated NoveltyAudit flow: a research claim and historical cutoff are frozen into facets, searched against earlier work, checked against dates and full text, reduced to a Minimal Prior Set, tested for historical bridges, and returned as an evidence-linked audit report\" width=\"100%\">
</p>

Give NoveltyAudit a **research claim** and a **historical cutoff**. It freezes the claim before searching, finds earlier work across scholarly sources, verifies dates and full-text evidence, identifies the smallest qualifying set of one to three prior papers, and checks whether those papers were meaningfully connected before the cutoff.

The output is a traceable report of **killer candidates**, **Minimal Prior Sets**, **bridge evidence**, **residual novelty**, and **search gaps**. Missing dates, full text, or required graph coverage can force `INCONCLUSIVE` instead of a reassuring guess.

## Quick start"""
          if old not in text:
              raise SystemExit("README insertion target was not found")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit the validated README update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "docs: explain the audit with a looping SVG"
          git push origin HEAD:docs/animated-user-flow
