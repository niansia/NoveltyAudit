name: Patch animated README flow

'on':
  push:
    branches:
      - docs/animated-user-flow

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Insert the user-facing animated flow
        run: python -c "import base64; exec(base64.b64decode(''))"
      - name: Commit the README update when needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "docs: explain the audit with a looping SVG"
          git push origin HEAD:docs/animated-user-flow
