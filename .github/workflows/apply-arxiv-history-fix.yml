name: Apply arXiv historical-version fix

on:
  push:
    branches: ["fix/arxiv-historical-version-lock"]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reassemble and verify patch archive
        shell: bash
        run: |
          cat .github/patches/arxiv-history-fix.part-* > "$RUNNER_TEMP/arxiv-history-fix.tar.xz"
          echo "c36aa5293e6ab928a78f9b24c8984953564f3e6850626bfa750f52dbdaeb7209  $RUNNER_TEMP/arxiv-history-fix.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/arxiv-history-fix.tar.xz" -C .
      - name: Run complete validation
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r scholarly-novelty-audit/requirements.txt
          python -m pytest scholarly-novelty-audit/tests -q
          python scholarly-novelty-audit/scripts/cli.py --help
          python scholarly-novelty-audit/scripts/secret_scan.py .
          git diff --check
      - name: Commit validated patch
        shell: bash
        run: |
          rm -rf .github/patches
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: pin arXiv evidence to historical versions"
          git push origin HEAD:fix/arxiv-historical-version-lock
