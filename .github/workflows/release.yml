name: Release runtime skill

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  clean-runtime-install:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_runtime_bundle.py --skill scholarly-novelty-audit --output dist/scholarly-novelty-audit-${{ github.ref_name }}.zip
      - run: python -m zipfile -e dist/scholarly-novelty-audit-${{ github.ref_name }}.zip "$RUNNER_TEMP/noveltyaudit-runtime"
      - run: python -m venv "$RUNNER_TEMP/noveltyaudit-venv"
      - run: >-
          "$RUNNER_TEMP/noveltyaudit-venv/bin/python"
          -m pip install
          -r "$RUNNER_TEMP/noveltyaudit-runtime/scholarly-novelty-audit/requirements.txt"
      - run: >-
          "$RUNNER_TEMP/noveltyaudit-venv/bin/python"
          "$RUNNER_TEMP/noveltyaudit-runtime/scholarly-novelty-audit/scripts/cli.py"
          --help

  release:
    needs: clean-runtime-install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -r scholarly-novelty-audit/requirements.txt
      - run: python -m pytest scholarly-novelty-audit/tests -q
      - run: python -m pip install "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - run: skills-ref validate ./scholarly-novelty-audit
      - run: python tools/build_runtime_bundle.py --skill scholarly-novelty-audit --output dist/scholarly-novelty-audit-${{ github.ref_name }}.zip
      - run: python -c "import zipfile; archive=zipfile.ZipFile('dist/scholarly-novelty-audit-${{ github.ref_name }}.zip'); assert archive.read('scholarly-novelty-audit/LICENSE') == open('LICENSE','rb').read()"
      - run: sha256sum --check scholarly-novelty-audit-${{ github.ref_name }}.zip.sha256
        working-directory: dist
      - run: >-
          gh release create "${{ github.ref_name }}"
          "dist/scholarly-novelty-audit-${{ github.ref_name }}.zip"
          "dist/scholarly-novelty-audit-${{ github.ref_name }}.zip.sha256"
          --verify-tag
          --generate-notes
          --title "NoveltyAudit ${{ github.ref_name }}"
        env:
          GH_TOKEN: ${{ github.token }}
