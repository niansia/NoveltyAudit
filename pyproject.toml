[project]
name = "novelty-audit"
version = "0.3.0"
description = "Composition-aware scholarly novelty audit Agent Skill"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "NoveltyAudit contributors"}]
keywords = ["agent-skills", "scholarly", "novelty", "literature-search", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["novelty-audit/tests"]
addopts = "-ra"
