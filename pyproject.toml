[project]
name = "scholarly-novelty-audit"
version = "0.3.2"
description = "Composition-aware scholarly novelty audit Agent Skill"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "NoveltyAudit contributors"}]
dependencies = ["jsonschema>=4.23", "pypdf>=5.0"]
keywords = ["agent-skills", "scholarly", "novelty", "literature-search", "research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis"
]

[project.urls]
Repository = "https://github.com/niansia/NoveltyAudit"
Issues = "https://github.com/niansia/NoveltyAudit/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["scholarly-novelty-audit/tests"]
addopts = "-ra"
